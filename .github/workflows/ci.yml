# The checks `scripts/check` runs, with the evaluator's reproducible build, except the Docker sandbox tests and the
# public-testnet scenarios, which need a Docker daemon or funds and are run deliberately. The browser tests run
# against local mock chain and model servers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its run; every commit on main keeps its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rust-toolchain` pins the channel, components and targets; installing with no arguments reads it.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # the contract as it is built: the `contract` feature on wasm32 compiles code native builds never see
      - run: cargo clippy -p extents-objective --target wasm32-unknown-unknown --features=contract -- -D warnings
      - run: cargo test --workspace

  # The two crates outside the workspace, which the `rust` job's `--all` and `--workspace` do not reach: their format,
  # then the evaluator program of the e2e's OutLayer scenario: its clippy, its tests, then its reproducible build,
  # which must give the recorded hash. OutLayer binds the program's key, and so the account an objective names as its
  # evaluator, to that hash (e2e/outlayer-evaluator/README.md). And the attestation verifier: its clippy and its
  # tests.
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            e2e/outlayer-evaluator -> ../../target/outlayer-evaluator
            e2e/outlayer-attestation -> ../../target/outlayer-attestation
      - run: cargo fmt --check
        working-directory: e2e/outlayer-evaluator
      - run: cargo fmt --check
        working-directory: e2e/outlayer-attestation
      # at clippy's default lints, not the workspace's; on the target the crate is built for, wasm32-wasip2, since the
      # host build leaves out the code that signs. The pinned toolchain does not list that target.
      - run: |
          rustup target add wasm32-wasip2
          cargo clippy --locked --all-targets -- -D warnings
        working-directory: e2e/outlayer-evaluator
      # its tests run on the host
      - run: |
          cargo test --locked --target "$(rustc -vV | sed -n 's/host: //p')"
        working-directory: e2e/outlayer-evaluator
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: e2e/outlayer-attestation
      - run: cargo test --locked
        working-directory: e2e/outlayer-attestation
      # in the pinned image, not with the toolchain above: only that build's hash is one others can check
      - run: e2e/outlayer-evaluator/build.sh --check

  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/objective/model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g @informalsystems/quint@0.34.0
      # Quint 0.34.0 fetches its Rust evaluator v0.8.0 from the GitHub API without a token, which shared runners
      # exhaust; fetch it with the job's token into the folder Quint checks first
      - name: Fetch Quint's Rust evaluator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$HOME/.quint/rust-evaluator-v0.8.0"
          mkdir -p "$dir"
          gh release download evaluator/v0.8.0 --repo quint-co/quint \
            --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz --dir "$dir"
          tar -xzf "$dir/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" -C "$dir"
          rm "$dir/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz"
          chmod +x "$dir/quint_evaluator"
      # the formal model's invariants, over random runs (contracts/objective/model/README.md)
      - run: quint run objective.qnt --invariant invariants --max-samples 20000 --max-steps 80 --seed 1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/model"
      # the contract replaying the model's runs; a fresh seed each run, printed on failure as QUINT_SEED
      - run: cargo test -p extents-objective --lib contract_follows_the_model -- --ignored
        env:
          RUSTFLAGS: --cfg near
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/model

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # the app's server runs on Bun
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
