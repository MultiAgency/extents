[package]
name = "outlayer-attestation"
edition = "2024"
license = "MIT"
version = "0.1.0"
publish = false

# A tool of its own, outside the workspace: it shares none of its dependencies.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
# Intel's quote verification, by Phala. OutLayer's register contract uses an
# older line of it (0.3), whose HTTP client pulls in a DNS resolver with open
# advisories.
dcap-qvl = "0.7.1"
hex = "0.4"
# the client dcap-qvl uses, which brings its TLS
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
